[project]
name = "vtx"
version = "1.0.8"
description = "Reference implementation of operators for deep signal processing architectures"
readme = "README.md"
authors = [{ name = "Michael Poli" }]
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = [
  "torch",
  "numpy",
  "einops==0.8.1",
  "packaging",
  "rich",
  "tqdm",
  "PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vortex*"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
  "gpu: requires a CUDA device",
  "e2e: end-to-end test that loads an Evo2 checkpoint (slow, large GPU memory)",
  "slow: takes >10s",
]
filterwarnings = ["ignore::DeprecationWarning:torch\\..*"]

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119
combine_as_imports = true
combine_star = true
